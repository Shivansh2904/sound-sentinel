version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/training"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2
    labels: ["dependencies", "training"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2
    labels: ["dependencies", "frontend"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
